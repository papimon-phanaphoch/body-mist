<head>

  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้าสินค้า */
    .page-head { padding: var(--space-6) 0 var(--space-4); }
    .page-head h1 { font-size: clamp(2rem, 4.5vw, 3rem); margin-bottom: 0; }
    .page-head .rule { margin-bottom: var(--space-2); }
    .page-head p { margin: 0; }
    .product-section { padding: 0 0 var(--space-6); }

    @media (max-width: 640px) {
      .page-head { padding: var(--space-5) 0 var(--space-3); }
      .product-section { padding-bottom: var(--space-5); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">

    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">

      </div>
    </section>

    <section class="product-section">

        <noscript><p>กรุณาเปิดใช้งาน JavaScript เพื่อดูรายการสินค้า</p></noscript>

  <footer class="site-footer">
    <div class="container">
